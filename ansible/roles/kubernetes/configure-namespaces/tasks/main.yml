---
- name: Create service account namespaces
  k8s:
    context: "{{ kubernetes.context }}"
    kubeconfig: "{{ kubernetes.kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item.value.namespace | default(kubernetes.default_namespace) }}"
        labels:
          infra.haondt.dev/managed-by: ansible
  loop: "{{ kubernetes.service_accounts | dict2items }}"
  delegate_to: 127.0.0.1

