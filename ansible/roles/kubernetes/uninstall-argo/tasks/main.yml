---
- name: Set role defaults
  set_fact:
    kubernetes: "{{ role_defaults | combine(kubernetes, recursive=True) }}"

- name: Uninstall argo-workflows via helm
  block:
    - name: Add argo Helm repo
      kubernetes.core.helm_repository:
        kubeconfig: "{{ kubernetes.kubeconfig }}"
        context: "{{ kubernetes.context }}"
        name: argo
        repo_url: https://argoproj.github.io/argo-helm
    - name: Uninstall argo-workflows Helm chart
      kubernetes.core.helm:
        kubeconfig: "{{ kubernetes.kubeconfig }}"
        context: "{{ kubernetes.context }}"
        name: argo-workflows
        chart_ref: argo/argo-workflows
        release_namespace: "argo-workflows"
        chart_version: "{{ kubernetes.argo.workflows.version }}"
        release_state: absent
        values:
          server:
            authModes:
              - server
          singleNamespace: true
          workflow:
            serviceAccount:
              create: true
              name: argo-workflow
            rbac:
              create: true
          controller:
            workflowNamespaces:
              - default
              - argo-workflows

    - name: Delete namespace
      k8s:
        kubeconfig: "{{ kubernetes.kubeconfig }}"
        context: "{{ kubernetes.context }}"
        state: absent
        kind: namespace
        name: argo-workflows
  delegate_to: 127.0.0.1
