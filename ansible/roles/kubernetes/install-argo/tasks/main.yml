---
- name: Set role defaults
  set_fact:
    kubernetes: "{{ role_defaults | combine(kubernetes, recursive=True) }}"

- name: Install argo-workflows via helm
  when: kubernetes.argo.workflows.enabled
  block:
    - name: Add argo Helm repo
      kubernetes.core.helm_repository:
        kubeconfig: "{{ kubernetes.kubeconfig }}"
        context: "{{ kubernetes.context }}"
        name: argo
        repo_url: https://argoproj.github.io/argo-helm
    - name: Install argo-workflows Helm chart
      kubernetes.core.helm:
        kubeconfig: "{{ kubernetes.kubeconfig }}"
        context: "{{ kubernetes.context }}"
        name: argo-workflows
        chart_ref: argo/argo-workflows
        release_namespace: "argo-workflows"
        chart_version: "{{ kubernetes.argo.workflows.version }}"
        release_state: present
        create_namespace: true
        values:
          server:
            authModes:
              - server
          singleNamespace: true
          workflow:
            serviceAccount:
              create: true
              name: argo-workflow
            rbac:
              create: true
          controller:
            workflowNamespaces:
              - default
              - argo-workflows

    - name: Template custom resources
      template:
        src: argo-workflows-custom-resources.yaml.j2
        dest: "{{ haondt.artifacts }}/argo-workflows-custom-resources.yaml"
    - name: Apply custom resources
      k8s:
        kubeconfig: "{{ kubernetes.kubeconfig }}"
        context: "{{ kubernetes.context }}"
        state: present
        src: "{{ haondt.artifacts }}/argo-workflows-custom-resources.yaml"
  delegate_to: 127.0.0.1
