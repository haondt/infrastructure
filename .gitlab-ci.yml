workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "trigger"

include:
  - project: 'haondt/CICD/pipelines'
    ref: main
    file: 'generate.yml'
    rules:
      - if: $CI_PIPELINE_SOURCE == "web"
  - local: trigger.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "trigger"

default_job:
  stage: .pre
  script:
    - echo "No pipeline configured for this trigger source"
