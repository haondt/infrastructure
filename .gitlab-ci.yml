stages:
  - bootstrap
  - base

include:
  - project: 'haondt/CICD/pipelines'
    ref: main
    file: 'generate.yml'
    rules:
      - if: $CI_PIPELINE_SOURCE == "web"

trigger:
  stage: base
  environment: trigger
  image: registry.gitlab.com/haondt/cicd/registry/infrastructure-runner:ansible-refactor-efa5d9e6
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
  script:
    - cp $SECRET deployment/secret.yml
    - cd deployment && make a-deb-update TARGET=$TARGET

