ssh:
  private_key_file: build/id_rsa
  public_keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINjSDZ49g0G2wpeTUe66hT5/bNlHt37Z+gEg7JZf/67f haondt@aurora
    - ssh-rsa  haondt@ansible
kubernetes:
  default_pod_cidr: 10.42.0.0/16
  kubeconfig: "~/.kube/config"

  alloy:
    blackbox:
      scrape: |
        // blackbox
        prometheus.scrape "blackbox_default" {
          targets    = prometheus.exporter.blackbox.default.targets
          forward_to = [prometheus.remote_write.mimir.receiver]
        }
      partial_components:
        blackbox-default:
          component: prometheus.exporter.blackbox
          label: default
          config: |-
            config = "{ modules: { http_2xx: { prober: http, timeout: 5s } } }"
    kube_state_metrics:
      scrape: |
        // kube-state-metrics
        prometheus.scrape "kube_state_metrics" {
          targets = [{"__address__" = "kube-state-metrics.kube-state-metrics.svc.cluster.local:8080"}]
          forward_to = [prometheus.remote_write.mimir.receiver]
        }
    smartctl:
      scrape: |
        // smartctl-exporter
        discovery.kubernetes "smartctl_exporter" {
          role = "pod"
          selectors {
            role = "pod"
            field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname) + ",metadata.namespace=smartctl-exporter"
            label = "app.kubernetes.io/instance=prometheus-smartctl-exporter,app.kubernetes.io/name=prometheus-smartctl-exporter"
          }
        }
        prometheus.scrape "smartctl_exporter" {
          targets = discovery.kubernetes.smartctl_exporter.targets
          forward_to = [prometheus.remote_write.mimir.receiver]
        }
    node_metrics: |
      // k8s nodes
      discovery.kubernetes "nodes" {
        role = "node"
        selectors {
          role = "node"
          field = "metadata.name=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      prometheus.scrape "nodes" {
        targets = discovery.kubernetes.nodes.targets
        scheme = "https"

        tls_config {
          insecure_skip_verify = true
        }

        authorization {
          credentials_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        }

        job_name = "kubelet"
        metrics_path = "/metrics/resource"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // node-exporter
      prometheus.exporter.unix "node_exporter" {
        set_collectors = [
          "cpu",
          "meminfo",
          "diskstats",
          "filesystem",
          "time",
          "stat",
        ]
      }
      prometheus.scrape "node_exporter" {
        targets = prometheus.exporter.unix.node_exporter.targets
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

    pod_logs: |
      // pod logs
      discovery.kubernetes "pod_logs" {
        role = "pod"
        selectors {
          role = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod_logs.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action = "replace"
          target_label = "dev_haondt_namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          target_label = "dev_haondt_pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "dev_haondt_container"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          action = "replace"
          target_label = "dev_haondt_node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
          action = "replace"
          target_label = "dev_haondt_app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action = "replace"
          target_label = "dev_haondt_component"
        }
      }

      loki.relabel "pod_logs" {
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.label_drop {
          values = ["job", "instance", "service_name"]
        }
        forward_to = [loki.write.default.receiver]
      }
