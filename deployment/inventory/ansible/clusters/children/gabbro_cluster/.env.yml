kubernetes:
  cluster_ip: 192.168.1.78
  alloy:
    prometheus_receiver: |
      prometheus.remote_write "mimir" {
        endpoint {
          url = "https://mimir.basalt.local.haondt.dev/api/v1/push"
        }
        external_labels = {
          dev_haondt_cluster = "gabbro_cluster",
        }
      }
    loki_receiver: |
      loki.write "default" {
        endpoint {
          url = "https://loki.basalt.local.haondt.dev/loki/api/v1/push"
        }
        external_labels = {
          dev_haondt_cluster = "gabbro_cluster",
        }
      }
