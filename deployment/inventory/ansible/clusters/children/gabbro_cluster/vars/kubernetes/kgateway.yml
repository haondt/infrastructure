enabled: true
load_balancer_ip: "[[ kubernetes.ingress_ip ]]"
version: "[[ kubernetes.kgateway.version ]]"
crds:
  version: "[[ kubernetes.kgateway.crds.version ]]"

node_port:
  enabled: false
  ports:
    30443: 443

listeners:
  haondt-dev:
    hostname: '*.haondt.dev'
  gabbro-local-haondt-dev:
    hostname: '*.gabbro.local.haondt.dev'
