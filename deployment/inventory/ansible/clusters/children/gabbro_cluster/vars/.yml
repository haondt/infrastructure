ansible_user: gabbro
ansible_ssh_private_key_file: [[ssh.private_key_file]]
ansible_python_interpreter: /usr/bin/python3
ssh:
  [[ ssh | to_yaml | indent(2) ]]
snapraid:
  disks:
    parity:
      - mount: /mnt/carrot-1
    data:
      - label: carrot-2
        mount: /mnt/carrot-2
      - label: carrot-3
        mount: /mnt/carrot-3
  extra_config: |
    exclude /mergerfs/gabbro/qbittorrent/incomplete/
    exclude /mergerfs/gabbro/ytptube/incomplete/
    exclude /mergerfs/gabbro/media_downloads/
mergerfs:
  version: 2.41.1
  package: bookworm_amd64
  branches:
    - /mnt/carrot-2/mergerfs
    - /mnt/carrot-3/mergerfs
  mountpoint: /mnt/carrot
  options:
    minfreespace: "100G"
