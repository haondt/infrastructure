kubernetes:
  cluster_ip: "192.168.1.100"
  ingress_ip: "192.168.1.101"
  alloy:
    prometheus_receiver: |
      prometheus.remote_write "mimir" {
        endpoint {
          url = "https://mimir.basalt.local.haondt.dev/api/v1/push"
        }
        external_labels = {
          dev_haondt_cluster = "marble",
          dev_haondt_node = coalesce(sys.env("HOSTNAME"), constants.hostname),
        }
      }
    loki_receiver: |
      loki.write "default" {
        endpoint {
          url = "https://loki.basalt.local.haondt.dev/loki/api/v1/push"
        }
        external_labels = {
          dev_haondt_cluster = "marble",
          dev_haondt_node = coalesce(sys.env("HOSTNAME"), constants.hostname),
        }
      }
